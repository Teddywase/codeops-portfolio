<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Habesha Eatery, Bole Addis Ababa</title>
    <meta name="description" content="Get in touch with Habesha Eatery in Bole, Addis Ababa. Send us a message or view our opening hours.">
</head>
<body>
    <header>
        <h1>Contact Habesha Eatery</h1>
        <nav>
            <a href="index.html">Reservations</a> - 
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Get in touch with us</h2>

        <form>
            <label for="name">Name</label><br>
            <input id="name" name="name" type="text" required placeholder="Your full name"><br>

            <label for="email">Email</label><br>
            <input id="email" name="email" type="email" required placeholder="you@example.com"><br>

            <label for="message">Message</label><br>
            <textarea id="message" name="message" rows="4" required placeholder="Your message here..."></textarea><br><br>

            <input type="submit" value="Send message">
        </form>

        <h2>Opening hours</h2>
        <table>
            <caption>Our opening hours</caption>
            <thead>
                <tr>
                    <th scope="col">Day</th>
                    <th scope="col">Hours</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Monday - Friday</td>
                    <td>10:00 AM - 10:00 PM</td>
                </tr>
                <tr>
                    <td>Saturday</td>
                    <td>11:00 AM - 11:00 PM</td>
                </tr>
                <tr>
                    <td>Sunday</td>
                    <td>12:00 PM - 9:00 PM</td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer>
        <p>Bole, Addis Ababa</p>
    </footer>
</body>
</html>
