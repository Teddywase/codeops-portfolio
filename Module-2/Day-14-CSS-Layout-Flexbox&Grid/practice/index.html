<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day-14 Exercise</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!--
        Exercise
        Question 1. Build a navbar with Flexbox: a logo on the left and three links plus a button on the right,
        vertically centered, using justify-content: space-between.
        -->
    <nav>
        <div class="logo">Logo</div>
        <div class="nav-right">
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Contact</a>
        </div>
    </nav>
    <!--
        Question 2. Create a row of four cards with flex: 1 so they share the width equally, then add flex-wrap and a
        gap so they reflow on a narrow screen.
        -->
    <div class="container">
        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
        <div class="card">Card 4</div>
    </div>

    <!--
        Question 3. Build a photo gallery with Grid using repeat(auto-fit, minmax(200px, 1fr)). Resize the window
        and confirm the column count changes on its own.
        -->
    <div class="gallery">
        <img src="./assets/image-1.jpg">
        <img src="./assets/image-2.jpg">
        <img src="./assets/image-3.jpg">
        <img src="./assets/image-4.jpg">
        <img src="./assets/image-5.jpg">
        <img src="./assets/image-6.jpg">
    </div>
    <!--
        Question 4. Lay out a full page with grid-template-areas: header, sidebar, main and footer. Add a media
        query that collapses it to a single column under 700px.
    -->
    <div class="layout">
        <header>Header</header>
        <aside>Sidebar</aside>
        <main>Main Content</main>
        <footer>Footer</footer>
    </div>
    <!--
        Question 5. Take a product card and pin a circular "ETB Sale" badge to its top-right corner 
        using relative + absolute positioning
    -->
    <div class="card">
        <div class="badge">ETB Sale</div>
        <img src="./assets/headphone.jpg">
        <h2>Headphones</h2>
        <p>ETB 1,999</p>
    </div>

</body>

</html>
