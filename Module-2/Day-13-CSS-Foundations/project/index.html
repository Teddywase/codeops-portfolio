<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telebirr Shop | Easy Payment</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <!-- Shop Header -->
        <div class="shop-header">
            <h1 class="shop-name">⭐ Buna Cafe</h1>
            <p class="shop-tagline">We Accept Telebirr ✓</p>
        </div>

        <!-- Products -->
        <div class="products">
            <div class="product-item">
                <span class="product-name">☕ Ethiopian Coffee</span>
                <span class="product-price">150 ETB</span>
            </div>
            <div class="product-item">
                <span class="product-name">🍵 Spiced Tea (Shai)</span>
                <span class="product-price">80 ETB</span>
            </div>
            <div class="product-item">
                <span class="product-name">🥐 Fresh Pastry</span>
                <span class="product-price">60 ETB</span>
            </div>
            <div class="product-item">
                <span class="product-name">🥤 Juice Fresh</span>
                <span class="product-price">100 ETB</span>
            </div>
        </div>

        <!-- Telebirr Payment -->
        <div class="payment-section">
            <h3>Pay with Telebirr</h3>

            <div class="telebirr-number">
                <span class="label">Telebirr Number:</span>
                <span class="number">09XX XXX XXX</span>
            </div>

            <div class="input-group">
                <label for="amount">Amount (ETB):</label>
                <input type="number" id="amount" class="amount-input" placeholder="Enter amount" min="1">
            </div>

            <button class="btn-pay">Pay Now</button>

            <p class="payment-note">
                <span class="note-icon">ℹ️</span>
                Click "Pay Now" to simulate payment
            </p>
        </div>

        <!-- Shop Info -->
        <div class="shop-footer">
            <p>Bole, Addis Ababa</p>
            <p>Open 7am - 10pm Daily</p>
        </div>
    </div>
</body>

</html>
