<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Market Shopping List</title>
</head>
<body>

    <h1>Addis Market Shopping List</h1>

    <form id="add-form">
        <label for="item-name">Item name:</label>
        <input type="text" id="item-name" placeholder="e.g. Coffee">
        <label for="item-price">Price (ETB):</label>
        <input type="number" id="item-price" placeholder="250" step="1" min="1">
        <button type="submit">Add item</button>
    </form>

    <ul id="market-list"></ul>

    <div>
        <strong>Total: </strong><span id="total-display">0</span> ETB
    </div>


</body>
<script src="./script.js"></script>
</html>
