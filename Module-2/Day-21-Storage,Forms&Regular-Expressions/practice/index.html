<!DOCTYPE html>
<html>

<head>
    <title>Day 21 Exercises</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- Theme Toggle (Exercise 1) -->
    <button class="theme-toggle" id="themeToggle">Toggle Theme</button>
    <div class="container">
        <!-- EXERCISE 1: Theme Toggle -->
        <div class="exercise-label">Exercise 1: Theme Toggle</div>
        <h1>My Project</h1>
        <p class="subtitle">Close and reopen the page — your theme choice should persist.</p>
        <button id="themeToggleBtn" class="btn-secondary">Toggle Theme</button>
        <div class="exercise-divider"></div>
        <!-- EXERCISES 3-6: Signup Form -->
        <div class="exercise-label">Exercises 3-6: Signup Form with Validation & Storage</div>
        <h1>Sign Up</h1>
        <p class="subtitle">Join the waitlist — your data stays in your browser.</p>
        <form id="signupForm">
            <div class="form-group">
                <label for="nameInput">Full Name</label>
                <input type="text" id="nameInput" placeholder="e.g. Selam Tesfaye" />
            </div>
            <div class="form-group">
                <label for="phoneInput">Phone Number</label>
                <input type="tel" id="phoneInput" placeholder="0912345678 or +251912345678" />
            </div>
            <div class="error-area" id="errorArea"></div>
            <div class="success-area" id="successArea"></div>
            <button type="submit">Sign Up</button>
        </form>
        <div class="signup-count">
            <span>People signed up: <span class="count-number" id="countNumber">0</span></span>
            <button class="clear-btn" id="clearAllBtn">Clear all</button>
        </div>
        <!-- Optional: Display entries (for testing) -->
        <div class="entries-list" id="entriesList"></div>
    </div>

</body>
    <script src="./script.js"></script>
</html>
