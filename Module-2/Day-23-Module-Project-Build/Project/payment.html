<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div id="paymentPopup" class="payment-popup">
        <div class="payment-box">
            <button id="closePayment" class="close-btn" ><a href="./index.html">✕</a></button>
            <h2>Payment</h2>
            <p>Total: <strong id="paymentTotal">0 ETB</strong></p>
            <form action="">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Your name" required>
                <label for="address">Address</label>
                <input type="text" id="address" placeholder="Enter your Address" required>
                <label  for="phone">Phone Number</label>
                <input type="text" id="phone" placeholder="0911234567 or +251911234567" required>
                <label for="paymentmethod">Payment Method</label>
                <select id="paymentMethod">
                    <option value="telebirr">Telebirr</option>
                    <option value="chapa">CBE</option>
                    <option value="cash">Cash on delivery</option>
                </select>
                <button id="payBtn" class="pay-btn" type="submit">Pay Now</button>
            </form>
            <div id="ordError" class="ordError"></div>
        </div>
    </div>
</body>
<script src="./payment.js"></script>
</html>
